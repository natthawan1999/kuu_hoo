<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#35706A" />
    <title>KUUHOO — Stock Counting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* ตัวหนังสือทั้งแอป Sarabun · ตัวเลข IBM Plex Mono (class font-mono และ tabular-nums) */
      body { font-family: 'Sarabun', system-ui, sans-serif; color: #0F172A; }
      .font-mono, .tabular-nums { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      input, textarea, select, button { font-family: inherit; }
      /* ปุ่มบนมือถือกดง่าย — พื้นที่กดขั้นต่ำ 44px ตามที่ออกแบบไว้ */
      button { touch-action: manipulation; }

      /* auto fit ทุกขนาดจอ */
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; overflow-x: hidden; overscroll-behavior-y: contain; }
      *, *::before, *::after { box-sizing: border-box; }
      /* ข้อความยาว/รหัสยาว ตัดบรรทัดแทนดันจอกว้าง */
      body, p, div, span, td, th, li, h1, h2, h3 { overflow-wrap: anywhere; word-break: break-word; }
      img, svg, video, canvas, table { max-width: 100%; }
      /* iOS ซูมจอเองเวลาแตะช่องกรอกที่ตัวอักษรเล็กกว่า 16px — กันด้วยการบังคับ 16px บนจอเล็ก */
      @media (max-width: 480px) {
        input:not([type="checkbox"]):not([type="radio"]), select, textarea { font-size: 16px !important; }
      }
      /* จอสูงจริงบนมือถือ (แถบเบราว์เซอร์ซ่อน/โผล่) */
      @supports (height: 100dvh) {
        .h-screen { height: 100dvh; }
        .min-h-screen { min-height: 100dvh; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
